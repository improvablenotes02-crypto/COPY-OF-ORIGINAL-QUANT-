# ====================================================
# QuantEngine -- pytest configuration (Phase 11C-Q).
#
# The canonical test command is:
#
#     python -m pytest tests/ -q
#
# Rationale: the repository root intentionally contains
# non-production material that must NEVER be collected as
# tests:
#
#   _archive/   historical research snapshots (legacy
#               modules with stale imports)
#   examples/   runnable usage scripts, not tests
#   .venv/      the local virtual environment
#   scripts/    operator / evidence scripts (run directly)
#
# Bare `pytest` (no path arg) therefore uses testpaths +
# norecursedirs below so it collects exactly tests/ and
# stays deterministic. Legacy exclusions are documented,
# not deleted.
# ====================================================

[pytest]
testpaths = tests
norecursedirs = _archive examples .venv .* logs data docs scripts core config backtesting risk
python_files = test_*.py
python_classes = Test*
python_functions = test_*
