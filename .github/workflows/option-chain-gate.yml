name: Option-chain integrity gate (Phase 466)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  option-chain:
    name: Option-chain validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify strict source manifest
        run: python scripts/generate_manifest.py --root . --verify --strict
      - name: Certify option-chain assembly and quote freshness
        run: python -m pytest tests/test_option_chain_phase465.py tests/test_option_chain_phase466.py tests/test_option_chain_phase467.py -q
