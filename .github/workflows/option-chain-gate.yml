name: Option-chain integrity gate (Phase 471)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  option-chain:
    name: Option-chain validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned test runner only
        run: python -m pip install pytest==9.0.3
      - name: Verify strict source manifest
        run: python scripts/generate_manifest.py --root . --verify --strict
      - name: Certify quote provenance, temporal coherence, contract precision, and immutable snapshots
        run: python -m pytest tests/test_option_chain_phase465.py tests/test_option_chain_phase466.py tests/test_option_chain_phase467.py tests/test_option_chain_phase468.py tests/test_option_chain_phase469.py tests/test_option_chain_phase470.py tests/test_option_chain_phase471.py -q
