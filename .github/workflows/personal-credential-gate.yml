name: Personal credential safety gate (Phase 482)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-setup:
    name: Personal credential setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test and settings dependencies
        run: python -m pip install pytest==9.0.3 python-dotenv==1.2.2 tzdata==2025.2
      - name: Verify strict source manifest
        run: python scripts/generate_manifest.py --root . --verify --strict
      - name: Certify personal credential region and environment isolation
        run: python -m pytest tests/test_delta_credential_setup_phase458.py tests/test_delta_credential_setup_phase474.py tests/test_quantengine_preflight_phase475.py tests/test_delta_connectivity_phase476.py tests/test_quantengine_doctor_phase477.py tests/test_flattrade_auth_phase479.py tests/test_flattrade_credentials_phase480.py tests/test_flattrade_rest_phase481.py tests/test_flattrade_connection_phase481.py tests/test_flattrade_candles_phase482.py -q
