name: Personal credential safety gate (Phase 474)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-setup:
    name: Personal credential setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test runner only
        run: python -m pip install pytest==9.0.3
      - name: Verify strict source manifest
        run: python scripts/generate_manifest.py --root . --verify --strict
      - name: Certify personal credential region and environment isolation
        run: python -m pytest tests/test_delta_credential_setup_phase458.py tests/test_delta_credential_setup_phase474.py -q
