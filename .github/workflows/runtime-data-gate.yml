name: Runtime data-gate certification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-runtime-data-gate:
    name: Paper runtime data gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify strict source manifest
        run: python scripts/generate_manifest.py --root . --verify --strict
      - name: Certify integrated tenant governance runtime boundaries
        run: python -m pytest tests/test_tenant_governance_runtime_phase379.py -q
      - name: Run focused runtime and tenant regression gate
        run: >-
          python -m pytest
          tests/test_realtime.py
          tests/test_order_executor.py
          tests/test_safety_guards_11a.py
          tests/test_submission_journal_phase278.py
          tests/test_account_risk_process_crash_recovery_phase323.py
          tests/test_delta_account_session_revocation_phase335.py
          tests/test_owner_governance_phase364.py
          tests/test_authenticated_owner_governance_phase366.py
          tests/test_delta_credential_approval_phase368.py
          tests/test_postgres_tenant_services_phase376.py
          tests/test_tenant_governance_runtime_phase379.py
          -q
      - name: Run full historical regression suite (manual release certification)
        if: github.event_name == 'workflow_dispatch'
        run: >-
          python -m pytest
          tests/test_realtime.py
          tests/test_order_executor.py
          tests/test_safety_guards_11a.py
          tests/test_submission_journal_phase261.py
          tests/test_submission_journal_phase267.py
          tests/test_submission_journal_phase268.py
          tests/test_submission_journal_phase269.py
          tests/test_submission_journal_phase270.py
          tests/test_submission_journal_phase271.py
          tests/test_submission_journal_phase272.py
          tests/test_submission_journal_phase273.py
          tests/test_submission_journal_phase274.py
          tests/test_submission_journal_phase275.py
          tests/test_submission_journal_phase276.py
          tests/test_order_executor_phase277.py
          tests/test_submission_journal_phase278.py
          tests/test_reconciliation_evidence_phase279.py
          tests/test_venue_history_identity_phase281.py
          tests/test_delta_account_identity_phase282.py
          tests/test_delta_region_authority_phase283.py
          tests/test_delta_account_registry_phase284.py
          tests/test_delta_identity_binding_phase285.py
          tests/test_delta_account_snapshot_phase286.py
          tests/test_account_risk_isolation_phase287.py
          tests/test_dataset_scope_provenance_phase288.py
          tests/test_backtester_scoped_provenance_phase289.py
          tests/test_portfolio_backtester_scoped_provenance_phase290.py
          tests/test_candle_sequence_integrity_phase292.py
          tests/test_scoped_backtest_execution_evidence_phase293.py
          tests/test_scoped_backtest_fingerprint_phase294.py
          tests/test_scoped_backtest_evidence_integrity_phase295.py
          tests/test_scoped_backtest_provenance_fingerprint_phase296.py
