name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Scan working tree
        run: python scripts/security/scan_secrets.py
      - name: Scan staged changes when present
        run: python scripts/security/scan_secrets.py --check-staged
      - name: Scan reachable Git history for credential-bearing .env files
        run: python scripts/security/scan_secrets.py --check-history
      - name: Test secret scanner regressions
        run: python -m pytest tests/test_secret_scan_phase193b.py tests/test_secret_scan_phase0.py -q
